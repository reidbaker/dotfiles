name: Skills Lint & Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Validate skills with skills_lint
        run: dart run skills_lint

      - name: Static Analysis
        run: dart analyze --fatal-infos

      - name: Check Cognitive Complexity (ceiling <= 15)
        run: dart run cognitive_complexity --fail-threshold 15 lib bin test

      - name: Run unit tests
        run: dart test
